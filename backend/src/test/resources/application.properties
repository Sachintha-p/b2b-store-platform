# In-Memory H2 Database for tests (isolated from Neon DB)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Google OAuth2 (Dummy values to satisfy ClientRegistrationRepository bean creation in CI)
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email

# Stripe (Dummy values)
stripe.api.key=sk_test_dummy
stripe.webhook.secret=whsec_dummy
stripe.success.url=http://localhost:5174/success
stripe.cancel.url=http://localhost:5174/cancel

# Brevo SMTP (Dummy values)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT Secret (Dummy value, must be valid base64 or long enough for the algorithm)
jwt.secret=DummySecretKeyThatIsAtLeast32BytesLongForHS256Algorithm

# Cloudinary (Dummy values for testing context load)
cloudinary.cloud-name=test-cloud
cloudinary.api-key=123456789
cloudinary.api-secret=test-secret

