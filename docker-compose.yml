version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    ports:
      - "8080:8080"
    environment:
      # Remote Neon.tech PostgreSQL (no local DB container needed)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ep-twilight-wave-b3o3xb8z-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - SPRING_DATASOURCE_USERNAME=neondb_owner
      - SPRING_DATASOURCE_PASSWORD=npg_98WZMYlSHPUd
      # Stripe
      - STRIPE_API_KEY=${STRIPE_API_KEY:-sk_test_placeholder}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      - STRIPE_SUCCESS_URL=http://localhost/success
      - STRIPE_CANCEL_URL=http://localhost/cancel
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
